<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | ELVRT Real Estate Tech</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #0d0d0d;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .error-container {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        
        .error-code {
            font-size: clamp(8rem, 15vw, 12rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -4px;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ffffff 0%, #a0a0a0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .error-headline {
            font-size: clamp(1.6rem, 3vw, 2.2rem);
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 1rem;
            letter-spacing: -0.5px;
        }
        
        .error-subtext {
            font-size: clamp(0.9rem, 1.5vw, 1.05rem);
            color: #888;
            font-weight: 300;
            line-height: 1.7;
            margin-bottom: 2.5rem;
            max-width: 450px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .back-home-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: #ff6b2b;
            color: #ffffff;
            text-decoration: none;
            padding: 0.9rem 2.2rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.3px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
        
        .back-home-btn:hover {
            background: #e55a1f;
            transform: translateY(-2px);
        }
        
        .back-home-btn:active {
            transform: translateY(0);
        }
        
        .back-home-btn svg {
            width: 20px;
            height: 20px;
            transition: transform 0.3s ease;
        }
        
        .back-home-btn:hover svg {
            transform: translateX(-3px);
        }
        
        /* Glitch effect on 404 */
        @keyframes glitch {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-3px, 2px); }
            40% { transform: translate(3px, -2px); }
            60% { transform: translate(-2px, -1px); }
            80% { transform: translate(2px, 1px); }
        }
        
        .error-code:hover {
            animation: glitch 0.3s ease-in-out;
        }
        
        /* Mobile Responsive */
        @media (max-width: 480px) {
            body {
                padding: 15px;
            }
            
            .error-code {
                letter-spacing: -2px;
            }
            
            .error-subtext {
                margin-bottom: 2rem;
            }
            
            .back-home-btn {
                padding: 0.75rem 1.5rem;
                font-size: 0.9rem;
                width: 100%;
                justify-content: center;
            }
        }
        
        @media (max-width: 360px) {
            .error-code {
                letter-spacing: -1px;
            }
        }
        
        /* Landscape mode */
        @media (max-height: 500px) and (orientation: landscape) {
            body {
                align-items: flex-start;
                padding-top: 30px;
            }
            
            .error-code {
                font-size: 5rem;
                margin-bottom: 0;
            }
            
            .error-subtext {
                margin-bottom: 1.5rem;
            }
        }
        
        /* Touch device optimizations */
        @media (hover: none) and (pointer: coarse) {
            .back-home-btn:hover {
                transform: none;
            }
            
            .back-home-btn:active {
                transform: scale(0.97);
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-headline">Oops, Wrong Turn</h1>
        <p class="error-subtext">Looks like even our AI got confused here. The page you're looking for doesn't exist or may have moved.</p>
        <a href="/" class="back-home-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back to Home
        </a>
    </div>
</body>
</html>
