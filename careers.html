<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Careers | ELVRT Real Estate Tech</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #0d0d0d;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .careers-container {
            text-align: center;
            max-width: 650px;
            width: 100%;
        }
        
        .careers-headline {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 1.2rem;
            letter-spacing: -1px;
            line-height: 1.2;
        }
        
        .careers-subtext {
            font-size: clamp(0.95rem, 1.5vw, 1.1rem);
            color: #888;
            font-weight: 300;
            line-height: 1.7;
            margin-bottom: 2.5rem;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .cta-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: #ff6b2b;
            color: #ffffff;
            text-decoration: none;
            padding: 0.9rem 2.2rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.3px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
        
        .cta-btn:hover {
            background: #e55a1f;
            transform: translateY(-2px);
        }
        
        .cta-btn:active {
            transform: translateY(0);
        }
        
        .cta-btn svg {
            width: 20px;
            height: 20px;
            transition: transform 0.3s ease;
        }
        
        .cta-btn:hover svg {
            transform: translateX(3px);
        }
        
        /* Mobile Responsive */
        @media (max-width: 480px) {
            body {
                padding: 15px;
            }
            
            .careers-subtext {
                margin-bottom: 2rem;
            }
            
            .cta-btn {
                padding: 0.75rem 1.5rem;
                font-size: 0.9rem;
                width: 100%;
                justify-content: center;
            }
        }
        
        /* Landscape mode */
        @media (max-height: 500px) and (orientation: landscape) {
            body {
                align-items: flex-start;
                padding-top: 40px;
            }
            
            .careers-subtext {
                margin-bottom: 1.5rem;
            }
        }
        
        /* Touch device optimizations */
        @media (hover: none) and (pointer: coarse) {
            .cta-btn:hover {
                transform: none;
            }
            
            .cta-btn:active {
                transform: scale(0.97);
            }
        }
    </style>
</head>
<body>
    <div class="careers-container">
        <h1 class="careers-headline">We're Just Getting Started</h1>
        <p class="careers-subtext">No open roles right now — but we're always on the lookout for sharp, ambitious people who want to build the future of real estate tech.</p>
        <a href="/contact" class="cta-btn">
            Get in Touch
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
        </a>
    </div>
</body>
</html>
